# Publish draft X threads after merge to m (paths under threads/).
# Posts via X API, then commits enriched YAML (tweet ids + status: published).
# Already-published files are skipped (avoids re-post loops on the enrich commit).
name: X thread publish

on:
  push:
    branches: [m]
    paths:
      - threads/**
      - '!threads/config.yml'
      - '!threads/.gitkeep'

permissions:
  contents: write

concurrency:
  group: x-thread-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the bot commit that only enriches already-published threads
    if: ${{ !contains(github.event.head_commit.message, '[skip x-thread-publish]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Commit-back needs a token that can push to m
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish draft threads
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npx tsx scripts/x-threads/bin/publish.ts

      - name: Commit enriched YAML
        run: |
          set -euo pipefail
          if git diff --quiet -- threads/; then
            echo "No enriched thread files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/*.yml
          git commit -m "chore(x-threads): enrich published thread ids [skip x-thread-publish]"
          git push

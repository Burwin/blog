title: Independently Deployable Tasks
status: draft
tweets:
  - text: |-
      When breaking up work tasks into smaller tasks, in the context of shipping complex software, the smaller tasks MUST be independently deployable.

      When this is not the case, it just creates a big ball of slop that’s now impossible to keep straight. When can we deploy task B? Does it need C? Does C need G? Ahhhh… I’m swimming.

      If it’s not independently deployable, it can’t get split off.

      If it’s split off and not independently deployable, then it needs to either be modified such that it can be safely deployed by itself, or merged back into the parent task.
